
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback | SmartCampus</title>

    <link rel="stylesheet" href="./assets/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #29234b;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 6%;
            background: white;
            box-shadow: 0 4px 20px #30216c12;
        }

        .nav-brand {
            color: #6548e8;
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .nav-links a {
            color: #393052;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #6548e8;
        }

        .page-header {
            padding: 55px 20px;
            text-align: center;
            color: white;
            background: linear-gradient(120deg, #6746e8, #4285ed, #21b9c5);
        }

        .page-header h1 {
            margin: 0 0 15px;
            font-size: clamp(30px, 5vw, 44px);
        }

        .page-header p {
            line-height: 1.8;
        }

        .feedback-container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .filter-panel {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            padding: 25px;
            margin-bottom: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px #34247710;
        }

        .filter-panel input,
        .filter-panel select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ded8f6;
            border-radius: 10px;
            background: #fcfbff;
            font-size: 15px;
        }

        .feedback-summary {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .feedback-summary strong {
            color: #6548e8;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .feedback-card {
            padding: 25px;
            border-radius: 20px;
            background: white;
            border: 1px solid #e9e4ff;
            border-bottom: 4px solid #7252ed;
            box-shadow: 0 8px 25px #34247710;
            overflow-wrap: anywhere;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .feedback-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px #34247720;
        }

        .feedback-card h3 {
            margin: 12px 0;
            color: #3d2b88;
        }

        .feedback-card p {
            line-height: 1.7;
        }

        .feedback-category {
            display: inline-block;
            padding: 7px 12px;
            color: #5b3bc5;
            background: #eee8ff;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .feedback-rating {
            color: #e6a400;
            font-size: 19px;
            letter-spacing: 2px;
        }

        .feedback-date {
            color: #77718c;
            font-size: 13px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 50px 20px;
            text-align: center;
            background: white;
            border-radius: 20px;
        }

        .empty-state .empty-icon {
            font-size: 45px;
        }

        .empty-state h2 {
            color: #49348e;
        }

        .empty-state a {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 22px;
            color: white;
            background: #6548e8;
            border-radius: 10px;
            text-decoration: none;
        }

        footer {
            margin-top: 60px;
            padding: 25px;
            text-align: center;
            color: white;
            background: #282044;
        }

        @media (max-width: 850px) {
            .feedback-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .filter-panel,
            .feedback-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">🎓 SmartCampus</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="submit.html">Submit Feedback</a>
            <a href="feedback.html">Feedback</a>
            <a href="analytics.html">Analytics</a>
            <a href="about.html">About</a>
           
        </div>
    </nav>

    <header class="page-header">
        <h1>💬 Student Feedback</h1>
        <p>Every opinion matters. Explore feedback and help improve our campus.</p>
    </header>

    <main class="feedback-container">

        <section class="filter-panel">
            <input
                type="search"
                id="searchFeedback"
                placeholder="🔍 Search feedback..."
                aria-label="Search feedback"
            >

            <select id="filterCategory" aria-label="Filter by category">
                <option value="">All Categories</option>
                <option value="Teaching">Teaching</option>
                <option value="Infrastructure">Infrastructure</option>
                <option value="Library">Library</option>
                <option value="Laboratory">Laboratory</option>
                <option value="Canteen">Canteen</option>
                <option value="Other">Other</option>
            </select>

            <select id="filterRating" aria-label="Filter by rating">
                <option value="">All Ratings</option>
                <option value="5">5 Stars</option>
                <option value="4">4 Stars</option>
                <option value="3">3 Stars</option>
                <option value="2">2 Stars</option>
                <option value="1">1 Star</option>
            </select>
        </section>

        <section class="feedback-summary">
            <span>Feedback submitted: <strong id="feedbackCount">0</strong></span>
            <span>Showing: <strong id="showingCount">0</strong></span>
        </section>

        <section id="feedbackList" class="feedback-grid" aria-live="polite"></section>

    </main>

    <footer>
        <p>© 2026 SmartCampus | Building a Better Campus Together 💜</p>
    </footer>

    <script>
        const STORAGE_KEY = "smartCampusFeedback";

        const feedbackList = document.getElementById("feedbackList");
        const feedbackCount = document.getElementById("feedbackCount");
        const showingCount = document.getElementById("showingCount");
        const searchInput = document.getElementById("searchFeedback");
        const categoryFilter = document.getElementById("filterCategory");
        const ratingFilter = document.getElementById("filterRating");

        function readFeedback() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                const data = stored ? JSON.parse(stored) : [];

                if (!Array.isArray(data)) {
                    return [];
                }

                return data;
            } catch (error) {
                console.error("Unable to read feedback:", error);
                return [];
            }
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);

            if (className) {
                element.className = className;
            }

            if (text !== undefined) {
                element.textContent = text;
            }

            return element;
        }

        function displayFeedback() {
            const allFeedback = readFeedback();

            feedbackCount.textContent = allFeedback.length;

            const searchText = searchInput.value.trim().toLowerCase();
            const selectedCategory = categoryFilter.value;
            const selectedRating = ratingFilter.value;

            const filtered = allFeedback.filter(function(item) {
                const searchableText = [
                    item.name,
                    item.department,
                    item.category,
                    item.subject,
                    item.message
                ].join(" ").toLowerCase();

                const matchesSearch = searchableText.includes(searchText);
                const matchesCategory =
                    !selectedCategory || item.category === selectedCategory;
                const matchesRating =
                    !selectedRating ||
                    Number(item.rating) === Number(selectedRating);

                return matchesSearch && matchesCategory && matchesRating;
            });

            showingCount.textContent = filtered.length;
            feedbackList.replaceChildren();

            if (filtered.length === 0) {
                const empty = createElement("div", "empty-state");
                empty.appendChild(createElement("div", "empty-icon", "💬"));

                empty.appendChild(createElement(
                    "h2",
                    "",
                    allFeedback.length === 0
                        ? "No Feedback Yet"
                        : "No Matching Feedback"
                ));

                empty.appendChild(createElement(
                    "p",
                    "",
                    allFeedback.length === 0
                        ? "Be the first to share your campus experience!"
                        : "Try changing your search or filter options."
                ));

                if (allFeedback.length === 0) {
                    const link = createElement("a", "", "Submit Feedback");
                    link.href = "submit.html";
                    empty.appendChild(link);
                }

                feedbackList.appendChild(empty);
                return;
            }

            filtered.slice().reverse().forEach(function(item) {
                const card = createElement("article", "feedback-card");

                card.appendChild(createElement(
                    "span",
                    "feedback-category",
                    item.category || "General"
                ));

                card.appendChild(createElement(
                    "h3",
                    "",
                    item.subject || "Student Feedback"
                ));

                const stars = "★".repeat(
                    Math.max(0, Math.min(5, Number(item.rating) || 0))
                );

                card.appendChild(createElement(
                    "div",
                    "feedback-rating",
                    stars + "☆".repeat(5 - stars.length)
                ));

                card.appendChild(createElement(
                    "p",
                    "",
                    item.message || ""
                ));

                card.appendChild(createElement(
                    "p",
                    "",
                    "👤 " + (item.name || "Anonymous")
                ));

                card.appendChild(createElement(
                    "p",
                    "",
                    "🎓 " + (item.department || "Not specified")
                ));

                let displayDate = item.date || "";

                if (displayDate) {
                    const parsedDate = new Date(displayDate);

                    if (!Number.isNaN(parsedDate.getTime())) {
                        displayDate = parsedDate.toLocaleDateString();
                    }
                }

                card.appendChild(createElement(
                    "div",
                    "feedback-date",
                    "📅 " + (displayDate || "Date unavailable")
                ));

                feedbackList.appendChild(card);
            });
        }

        searchInput.addEventListener("input", displayFeedback);
        categoryFilter.addEventListener("change", displayFeedback);
        ratingFilter.addEventListener("change", displayFeedback);

        window.addEventListener("storage", function(event) {
            if (event.key === STORAGE_KEY) {
                displayFeedback();
            }
        });

        displayFeedback();
    </script>

</body>
</html>
```
